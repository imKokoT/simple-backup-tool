name: launcher tests

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - src/operations/manage/launcher.py
  pull_request:
    branches: [ master ]
    paths:
      - src/operations/manage/launcher.py

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
         - ubuntu-latest
         - windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest

    - name: Run tests with pytest
      run: pytest tests/integration/test_operation_manage_launcher.py
